name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            zen-reader/package-lock.json
            scholar/package-lock.json
            editorial/package-lock.json
            neon/package-lock.json
            vintage/package-lock.json
            lexicon/package-lock.json

      - name: Install dependencies for all apps
        run: |
          echo "Installing dependencies for all apps..."
          for app in zen-reader scholar editorial neon vintage lexicon; do
            echo "Installing $app dependencies..."
            cd $app && npm ci && cd ..
          done

      - name: Build all apps
        run: |
          echo "Building all apps..."
          for app in zen-reader scholar editorial neon vintage lexicon; do
            echo "Building $app..."
            cd $app && npm run build && cd ..
          done

      - name: Create deployment directory
        run: |
          echo "Creating deployment directory..."
          mkdir -p dist

          # Copy all built apps
          for app in zen-reader scholar editorial neon vintage lexicon; do
            echo "Copying $app to deployment directory..."
            cp -r $app/dist dist/$app
          done

          # Copy landing page
          cp index.html dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
